version: "3.9"

# ========= Plantillas / anclas para reutilizar opciones =========
x-restart: &default-restart unless-stopped
x-networks: &default-networks
  - labnet

x-kafka-image: &kafka-image confluentinc/cp-kafka:8.1.0
x-sr-image: &sr-image confluentinc/cp-schema-registry:8.1.0

networks:
  labnet:

volumes:
  pgdata:

services:
  # ======================== Apache Kafka (KRaft 1 nodo) ========================
  kafka:
    image: *kafka-image
    container_name: kafka
    hostname: kafka
    restart: *default-restart
    networks: *default-networks
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 1 solo nodo ⇒ replicación en 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================= Schema Registry ==============================
  schema-registry:
    image: *sr-image
    container_name: schema-registry
    hostname: schema-registry
    restart: *default-restart
    networks: *default-networks
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://schema-registry:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================== Kafdrop UI ================================
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    restart: *default-restart
    networks: *default-networks
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================== PostgreSQL DB ===============================
  postgres:
    build: ./database
    container_name: postgres_db
    restart: *default-restart
    networks: *default-networks
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: yahoo_dataset
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d yahoo_dataset -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================== Inicialización de tópicos =========================
  init-topics:
    image: *kafka-image
    container_name: init-topics
    restart: "no"
    networks: *default-networks
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./topics.sh:/topics.sh:ro
    entrypoint: ["/bin/bash", "/topics.sh"]

  # =============================== Generador tráfico ============================
  generador_traf:
    build:
      context: .
      dockerfile: generador_traf/Dockerfile
    container_name: generador_traf
    restart: *default-restart
    networks: *default-networks
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      PENDING_TOPIC: questions.pending
      DB_HOST: postgres
      DB_NAME: yahoo_dataset
      DB_USER: user
      DB_PASS: 1234

  # =============================== App Node.js (LLM) ===========================
  llm_app:
    build: ./llm
    container_name: llm_app
    restart: *default-restart
    networks: *default-networks
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  # =============================== Flink Quality ===============================
  flink:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink
    restart: *default-restart
    networks: *default-networks
    depends_on:
      kafka:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
